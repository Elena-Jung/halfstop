<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      // React 가 그리기 전에 저장된 테마를 올립니다. 여기서 하지 않으면 어두운 테마로
      // 한 번 그려졌다가 밝은 테마로 바뀌는 번쩍임이 생깁니다. 이 키는
      // src/platform/themeStore.ts 의 저장 키와 반드시 같아야 합니다.
      (function () {
        try {
          if (localStorage.getItem('halfstop.theme.v1') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch {
          // 사생활 보호 모드 등에서는 저장소 접근이 던집니다. 기본값인 어두운 테마로
          // 둡니다.
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14161a" />

    <title>halfstop | 사진에 촬영 정보를 프레임으로 붙이는 도구</title>
    <meta
      name="description"
      content="halfstop은 사진에 촬영 정보(EXIF)를 프레임으로 붙여 브라우저 안에서 바로 내려받는 도구이며, 사진 파일은 서버로 전송되지 않습니다."
    />
    <link rel="canonical" href="https://halfstop.pages.dev/" />

    <meta property="og:title" content="halfstop | 사진에 촬영 정보를 프레임으로 붙이는 도구" />
    <meta
      property="og:description"
      content="사진에 카메라, 렌즈, 조리개, 셔터 속도, ISO 같은 촬영 정보를 프레임으로 붙여 내려받습니다. 사진 파일은 브라우저를 떠나지 않습니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://halfstop.pages.dev/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root">
      <h1>halfstop</h1>
      <p>halfstop은 사진에 촬영 정보(EXIF)를 프레임으로 붙여 다시 내려받는 도구입니다.</p>
      <p>
        JPEG, PNG, WebP 사진을 불러오면 카메라와 렌즈, 조리개, 셔터 속도, ISO 같은 촬영
        정보를 자동으로 읽어 프레임에 표시합니다. 여러 프리셋 중에서 고를 수 있습니다.
      </p>
      <p>사진 파일은 브라우저를 떠나지 않습니다. 서버로 전송되지 않고 기기 안에서만 처리됩니다.</p>
      <p>이 도구를 쓰려면 자바스크립트를 켜야 합니다.</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
