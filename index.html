<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <script>
      // React 가 그리기 전에 저장된 테마를 올립니다. 여기서 하지 않으면 어두운 테마로
      // 한 번 그려졌다가 밝은 테마로 바뀌는 번쩍임이 생깁니다. 이 키는
      // src/platform/themeStore.ts 의 저장 키와 반드시 같아야 합니다.
      (function () {
        try {
          if (localStorage.getItem('halfstop.theme.v1') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch {
          // 사생활 보호 모드 등에서는 저장소 접근이 던집니다. 기본값인 어두운 테마로
          // 둡니다.
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1e1e1e" />

    <title>halfstop - EXIF 정보를 프레임으로</title>
    <meta name="description" content="halfstop - EXIF 정보를 프레임으로. 사진은 브라우저를 떠나지 않습니다." />
    <link rel="canonical" href="https://halfstop.pages.dev/" />

    <meta property="og:title" content="halfstop - EXIF 정보를 프레임으로" />
    <meta property="og:description" content="EXIF 정보를 프레임으로. 사진은 브라우저를 떠나지 않습니다." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://halfstop.pages.dev/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <!--
      React 가 붙기 전까지 잠깐 보이는 글이고, 자바스크립트를 끈 방문자와 검색 로봇이 보는
      유일한 내용입니다. 길면 페이지를 열 때마다 글 뭉치가 번쩍 스쳐 지나가므로 한 줄로
      줄였습니다. 자바스크립트 안내는 남겨 둡니다. 없으면 자바스크립트를 끈 사람이 제목만
      보고 아무 일도 안 일어나는 이유를 알 길이 없습니다.
    -->
    <div id="root">
      <h1>halfstop</h1>
      <p>EXIF 정보를 프레임으로</p>
      <p>자바스크립트를 켜야 합니다.</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
