name: 검사

# 배포는 Cloudflare Pages 의 Git 연동이 맡습니다. 여기서 배포까지 하면 같은 사이트에 두
# 갈래로 들어가 서로 덮어씁니다. 이 워크플로는 검사만 합니다. 그래서 Cloudflare API 토큰을
# GitHub 에 넣을 일도 없습니다.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # 사람이 커밋 전에 돌리는 것과 같은 명령입니다. 둘이 갈라지면 CI 만 통과하거나
      # CI 만 실패하는 상태가 생깁니다.
      - run: npm run check
