<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="halfstop">
  <!--
    수평 노출계입니다. 가로 눈금 위에서 가운데가 0 이고, 지시자 삼각형이 아래에서 위를
    가리키며 0 보다 반 칸 넘어간 자리에 있습니다. 이름의 half 가 그 반 칸입니다.

    삼각형이 위를 향하는 것이 중요합니다. 아래를 향하면 내려받기 아이콘으로 읽히는데,
    이 앱에는 내려받기 단추가 따로 있어 혼동이 큽니다. 16px 로 실제로 그려 확인했습니다.

    선 끝을 둥글리지 않습니다. 계기판 눈금처럼 딱 떨어지게 하려는 것이고 사용자가 고른
    모양입니다.

    색은 앱의 중성 회색 토큰과 같은 값입니다. 타일이 bg, 눈금이 text, 지시자가 accent
    입니다. 토큰을 바꾸면 이 파일도 함께 맞추십시오. CSS 변수는 여기까지 닿지 않습니다.

    XML 주석 안에는 이중 하이픈을 쓸 수 없습니다. 토큰 이름을 그대로 적었다가 파일이
    통째로 유효하지 않은 XML 이 되어 브라우저가 그리지 못한 적이 있습니다. 그래서
    여기서는 앞의 하이픈 두 개를 떼고 적습니다.
  -->
  <rect width="32" height="32" rx="7" fill="#1e1e1e"/>
  <path d="M5.5 19h21" stroke="#e0e0e0" stroke-width="2.6"/>
  <path d="M16 19v-8" stroke="#e0e0e0" stroke-width="2.8"/>
  <path d="M8 19v-4.5M24 19v-4.5" stroke="#e0e0e0" stroke-width="2.4"/>
  <path d="M20.5 20.8L17.1 27h6.8Z" fill="#4a9eff"/>
</svg>
